apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: namespace
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dharmasaiajay-png/DevSecOps.git
    targetRevision: main
    path: k8s/namespace

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
