apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: devsecops


spec:

  replicas: 2


  selector:

    matchLabels:
      app: frontend


  template:

    metadata:

      labels:
        app: frontend


    spec:

      containers:

      - name: frontend

        image: image: 564362507028.dkr.ecr.ap-south-2.amazonaws.com/frontend:latest


        ports:

        - containerPort: 80
