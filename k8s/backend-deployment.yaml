apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devsecops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend


  template:
    metadata:
      labels:
        app: backend


    spec:

      containers:

      - name: backend

        image: dharmasaiajay/backend:latest

        ports:
        - containerPort: 3500


        env:

        - name: PORT
          value: "3500"


        - name: MONGO_CONN_STR
          value: "mongodb://mongodb:27017/devsecops"


        - name: USE_DB_AUTH
          value: "false"


        readinessProbe:
          httpGet:
            path: /ready
            port: 3500
          initialDelaySeconds: 10
          periodSeconds: 10


        livenessProbe:
          httpGet:
            path: /healthz
            port: 3500
          initialDelaySeconds: 30
          periodSeconds: 20
