apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-ingress
  namespace: devsecops
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  rules:
  - host: ajaydevsecopsproject.duckdns.org
    http:
      paths:

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

      - path: /healthz
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3500

      - path: /ready
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3500

      - path: /started
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3500

      - path: /api/tasks
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3500
